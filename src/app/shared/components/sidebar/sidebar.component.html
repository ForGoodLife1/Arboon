@if (layoutService.isMobileMenuOpen()) {
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 lg:hidden animate-fade-in" 
       (click)="layoutService.closeMenu()"></div>
}

<aside [class.translate-x-full]="!layoutService.isMobileMenuOpen()"
       [class.translate-x-0]="layoutService.isMobileMenuOpen()"
       class="h-screen w-72 border-l border-white/10 right-0 fixed bg-[#0B0F10]/95 backdrop-blur-2xl z-50 flex flex-col transition-transform duration-300 ease-in-out lg:translate-x-0" 
       dir="rtl">
  
  <div class="px-8 pt-16 lg:pt-24 pb-8 relative">
    
    <button (click)="layoutService.closeMenu()" 
            class="absolute top-6 left-6 lg:hidden text-zinc-500 hover:text-white p-2 bg-white/5 rounded-full transition-colors">
      <span class="material-symbols-outlined text-sm">close</span>
    </button>

    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-center">
        <span class="material-symbols-outlined text-emerald-500" style="font-variation-settings: 'FILL' 1;">security</span>
      </div>
      <div>
        <h1 class="text-lg font-bold text-emerald-500">عُربون برو</h1>
        <p class="text-[10px] text-zinc-500 uppercase tracking-widest">حساب مؤسسي موثق</p>
      </div>
    </div>

    <nav class="space-y-2">
      <a routerLink="/dashboard" (click)="layoutService.closeMenu()" routerLinkActive="bg-emerald-500/10 text-emerald-500 border-emerald-500" [routerLinkActiveOptions]="{exact: true}" class="flex items-center gap-4 px-6 py-4 font-bold transition-all border-r-4 border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-white/5 rounded-l-xl">
        <span class="material-symbols-outlined">dashboard</span>
        <span class="flex-1">لوحة التحكم</span>
      </a>
      <a routerLink="/wallet" (click)="layoutService.closeMenu()" routerLinkActive="bg-emerald-500/10 text-emerald-500 border-emerald-500" class="flex items-center gap-4 px-6 py-4 font-bold transition-all border-r-4 border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-white/5 rounded-l-xl">
        <span class="material-symbols-outlined">account_balance_wallet</span>
        <span class="flex-1">سجل المحفظة</span>
      </a>
      <a routerLink="/disputes" (click)="layoutService.closeMenu()" routerLinkActive="bg-emerald-500/10 text-emerald-500 border-emerald-500" class="flex items-center gap-4 px-6 py-4 font-bold transition-all border-r-4 border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-white/5 rounded-l-xl">
        <span class="material-symbols-outlined">gavel</span>
        <span class="flex-1">مركز النزاعات</span>
      </a>
      <a routerLink="/integration" (click)="layoutService.closeMenu()" routerLinkActive="bg-emerald-500/10 text-emerald-500 border-emerald-500" class="flex items-center gap-4 px-6 py-4 font-bold transition-all border-r-4 border-transparent text-zinc-500 hover:text-zinc-200 hover:bg-white/5 rounded-l-xl">
        <span class="material-symbols-outlined">api</span>
        <span class="flex-1">الربط البرمجي (API)</span>
      </a>
    </nav>
  </div>

  <div class="mt-auto p-8 border-t border-white/5">
    <a routerLink="/create" (click)="layoutService.closeMenu()" class="w-full bg-emerald-500 text-[#0B0F10] font-bold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all mb-6 hover:brightness-110 shadow-lg shadow-emerald-500/10">
      <span class="material-symbols-outlined">add_circle</span>
      إنشاء عُهدة جديدة
    </a>
    <div class="space-y-2">
      <a routerLink="/settings" (click)="layoutService.closeMenu()" routerLinkActive="bg-white/10 text-white" class="flex items-center gap-4 px-6 py-3 font-medium transition-colors text-zinc-500 hover:text-zinc-200 hover:bg-white/5 rounded-xl">
        <span class="material-symbols-outlined">settings</span>
        <span class="flex-1">الإعدادات</span>
      </a>
      <button type="button" class="w-full flex items-center gap-4 px-6 py-3 font-medium transition-colors text-red-500/70 hover:text-red-500 hover:bg-red-500/10 rounded-xl">
        <span class="material-symbols-outlined">logout</span>
        <span class="flex-1 text-right">تسجيل الخروج</span>
      </button>
    </div>
  </div>
</aside>
